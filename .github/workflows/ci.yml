name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — fast feedback, no wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate (CLAUDE.md §6) on Bun. Docker is available on ubuntu runners by
  # default, so the matrix suite runs the FULL matrix here — Postgres (via
  # Testcontainers) and SQLite — with no skips.
  gate-bun:
    name: Gate (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (TypeScript 7)
        run: bun run typecheck

      - name: Lint (oxlint --type-aware)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format

      - name: Test (matrix suite — full matrix, Docker available)
        run: bun run test

      - name: Test (admin — jsdom/testing-library, own bunfig)
        run: bun run test:admin

  # The runtime dimension of the matrix: the SAME specs run under Node via `node --test`
  # (Node's native TypeScript + test runner), exercising the Node side of the runtime seam —
  # node:fs/child_process and, crucially, the better-sqlite3 SQLite driver that cannot load on
  # Bun. Deps are installed with Bun (same lockfile + native builds); only the test runner is Node.
  gate-node:
    name: Gate (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (Node runtime — full matrix under node --test)
        run: bun run test:node
