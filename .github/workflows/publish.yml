name: Publish Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GLAZE_REGISTRY_URL: ${{ secrets.GLAZE_REGISTRY_URL }}
      GLAZE_REGISTRY_TOKEN: ${{ secrets.GLAZE_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wake up Registry
        run: |
          echo "Waking up registry..."
          # Extract domain from auth URL if needed, or just hit the base
          # Assuming the URL is secret, we try to curl it
          for i in {1..10}; do
            # -I head request, -L follow redirects, -f fail on error
            if curl -s -I -f -L "$GLAZE_REGISTRY_URL" > /dev/null; then
              echo "Registry is awake!"
              exit 0
            fi
            echo "Waiting for registry to wake up (attempt $i/10)..."
            sleep 5
          done
          echo "WARNING: Registry might still be sleeping or unreachable."

      - name: Publish @glaze packages
        run: |
          # Publish in dependency order: create-glaze-app → shared → logger → admin → core → cms
          echo "Publishing create-glaze-app..."
          cd packages/create-glaze-app
          bun publish --non-interactive || echo "Skipping create-glaze-app (likely already published)"
          cd ../..

          echo "Publishing @glaze/shared..."
          cd packages/shared
          bun publish --non-interactive || echo "Skipping shared (likely already published)"
          cd ../..

          echo "Publishing @glaze/logger..."
          cd packages/logger
          bun publish --non-interactive || echo "Skipping logger (likely already published)"
          cd ../..

          echo "Publishing @glaze/config..."
          cd packages/config
          bun publish --non-interactive || echo "Skipping config (likely already published)"
          cd ../..

          echo "Publishing @glaze/admin..."
          cd packages/admin
          bun publish --non-interactive || echo "Skipping admin (likely already published)"
          cd ../..

          echo "Publishing @glaze/core..."
          cd packages/core
          bun publish --non-interactive || echo "Skipping core (likely already published)"
          cd ../..

          echo "Publishing @glaze/cms..."
          cd packages/cms
          bun publish --non-interactive || echo "Skipping cms (likely already published)"
          cd ../..
