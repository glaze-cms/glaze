name: Publish Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GLAZE_REGISTRY_URL: ${{ secrets.GLAZE_REGISTRY_URL }}
      GLAZE_REGISTRY_TOKEN: ${{ secrets.GLAZE_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Wake up Registry
        run: |
          echo "Waking up registry..."
          for i in {1..10}; do
            # -I head request, -L follow redirects, -f fail on error
            if curl -s -I -f -L "$GLAZE_REGISTRY_URL" > /dev/null; then
              echo "Registry is awake!"
              exit 0
            fi
            echo "Waiting for registry to wake up (attempt $i/10)..."
            sleep 5
          done
          echo "WARNING: Registry might still be sleeping or unreachable."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish @glaze packages
        run: |
          # Captures output and only silently skips on "already exists" errors.
          # Any other failure exits non-zero and fails the job.
          publish() {
            local pkg=$1
            local output
            output=$(bun publish --non-interactive 2>&1)
            local code=$?

            if [ $code -eq 0 ]; then
              echo "✅ Published $pkg"
              return 0
            fi

            # Registries phrase this differently — match the common variants
            if echo "$output" | grep -qiE "already exists|cannot publish over|previously published|already been published"; then
              echo "⏭️  $pkg already published at this version, skipping"
              return 0
            fi

            echo "❌ Failed to publish $pkg:"
            echo "$output"
            exit 1
          }

          # Publish in dependency order
          cd packages/create-glaze-app && publish @glaze/create-glaze-app && cd ../..
          cd packages/shared         && publish @glaze/shared      && cd ../..
          cd packages/logger         && publish @glaze/logger       && cd ../..
          cd packages/config         && publish @glaze/config       && cd ../..
          cd packages/convergence    && publish @glaze/convergence  && cd ../..
          cd packages/admin          && publish @glaze/admin        && cd ../..
          cd packages/core           && publish @glaze/core         && cd ../..
          cd packages/cms            && publish @glaze/cms          && cd ../..
